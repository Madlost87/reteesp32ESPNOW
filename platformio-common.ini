[env]
platform = platformio/espressif32@6.9.0
framework = arduino
; Profilo di BUILD provvisorio: non identifica flash o modello delle schede reali.
board = esp32dev
; Explicit dual OTA slots; same partition layout as previous default builds.
board_build.partitions = default.csv
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags = -I../shared
